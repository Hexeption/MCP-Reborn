buildscript {
    repositories {
        mavenLocal()
        maven { url = 'http://files.minecraftforge.net/maven' }
        maven { url = 'http://repo.hexeption.co.uk/artifactory/list/Strezz-Central/'}
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.43'
    }
}

apply plugin: 'eclipse'

group = 'pre-mcp'
version = '1.0.0'

project(':mcp') {
    apply plugin: 'net.minecraftforge.gradle.forgedev.mcp'
    mcp {
        config = 'de.oceanlabs.mcp:mcp_config:1.13.2'
        pipeline = 'joined'
    }
}

evaluationDependsOn(':mcp')
apply plugin: 'eclipse'
repositories {
    maven { url = 'https://libraries.minecraft.net/'}
    mavenCentral()
}
apply plugin: 'net.minecraftforge.gradle.forgedev.patcher'
patcher {
    parent = project(':mcp')
    patchedSrc = file('src/main/java')
    mappings channel: 'snapshot', version: '20190314-1.13.2'
    mcVersion = '1.13.2'
}
task runclient(type: JavaExec) {
    group = "MCP"
    description = "Runs the client"
    doFirst {
        mkdir 'runclient'
    }
    classpath sourceSets.main.runtimeClasspath
    args = ['--accessToken', '0', '--version', '1.13']
    main 'net.minecraft.client.main.Main'
    workingDir 'runclient'
}

task setup() {
    group = "MCP"
    description = "Setups the dev workspace"
    dependsOn ':extractMapped'
}

task serverJar(type: Jar) {
    group = "MCP"
    description = "Builds a runnable server jar into build/server"
    archiveName = 'server.jar'
    destinationDir = file("$buildDir/server")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def gameJars = ['client-extra.jar', 'client-data.jar']
    def libraries = { sourceSets.main.runtimeClasspath.filter { it.isFile() && it.name.endsWith('.jar') && !(it.name in gameJars) } }

    from sourceSets.main.output
    from({ sourceSets.main.runtimeClasspath.findAll { it.name in gameJars }.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }

    doFirst {
        manifest.attributes(
                'Main-Class': 'net.minecraft.server.MinecraftServer',
                'Class-Path': libraries().collect { 'libraries/' + it.name }.join(' ')
        )
    }
    doLast {
        copy {
            from libraries()
            into "$buildDir/server/libraries"
        }
    }
}

task installClient(type: Jar) {
    group = "MCP"
    description = "Installs the client into the Minecraft launcher's versions folder"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def os = System.getProperty('os.name').toLowerCase()
    def home = System.getProperty('user.home')
    def mcDir = file(project.findProperty('mcDir') ?: (os.contains('win') ? System.getenv('APPDATA') + '/.minecraft'
            : os.contains('mac') ? home + '/Library/Application Support/minecraft' : home + '/.minecraft'))
    def versionName = project.findProperty('versionName') ?: '1.13.2' + '-mcp'
    def versionDir = new File(mcDir, 'versions/' + versionName)

    archiveName = versionName + '.jar'
    destinationDir = versionDir

    from sourceSets.main.output
    from({ sourceSets.main.runtimeClasspath.findAll { it.name in ['client-extra.jar', 'client-data.jar'] }.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }

    doLast {
        def json = new groovy.json.JsonSlurper().parse(project(':mcp').file('build/mcp/downloadJson/version.json'))
        json.remove('downloads')
        json.id = versionName
        new File(versionDir, versionName + '.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        println "Installed $versionName into $versionDir"
    }
}
