buildscript {
    repositories {
        mavenLocal()
        maven { url = 'http://files.minecraftforge.net/maven' }
        maven { url = 'http://repo.hexeption.co.uk/artifactory/list/Strezz-Central/'}
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.43'
    }
}

apply plugin: 'eclipse'

group = 'pre-mcp'
version = '1.0.0'

project(':mcp') {
    apply plugin: 'net.minecraftforge.gradle.forgedev.mcp'
    mcp {
        config = 'de.oceanlabs.mcp:mcp_config:1.13.2'
        pipeline = 'joined'
    }
}

evaluationDependsOn(':mcp')
apply plugin: 'eclipse'
repositories {
    maven { url = 'https://libraries.minecraft.net/'}
    mavenCentral()
}
apply plugin: 'net.minecraftforge.gradle.forgedev.patcher'
patcher {
    parent = project(':mcp')
    patchedSrc = file('src/main/java')
    mappings channel: 'snapshot', version: '20190314-1.13.2'
    mcVersion = '1.13.2'
}
task runclient(type: JavaExec) {
    group = "MCP"
    description = "Runs the client"
    doFirst {
        mkdir 'runclient'
    }
    classpath sourceSets.main.runtimeClasspath
    args = ['--accessToken', '0', '--version', '1.13']
    main 'net.minecraft.client.main.Main'
    workingDir 'runclient'
}

task setup() {
    group = "MCP"
    description = "Setups the dev workspace"
    dependsOn ':extractMapped'
}

task serverJar(type: Jar) {
    group = "MCP"
    description = "Builds a runnable server jar into build/server"
    archiveName = 'server.jar'
    destinationDir = file("$buildDir/server")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def clientExtra = { sourceSets.main.runtimeClasspath.find { it.name == 'client-extra.jar' } }
    def libraries = { sourceSets.main.runtimeClasspath.filter { it.isFile() && it.name.endsWith('.jar') && it.name != 'client-extra.jar' } }

    from sourceSets.main.output
    from({ zipTree(clientExtra()) }) {
        exclude 'META-INF/**'
    }

    doFirst {
        manifest.attributes(
                'Main-Class': 'net.minecraft.server.MinecraftServer',
                'Class-Path': libraries().collect { 'libraries/' + it.name }.join(' ')
        )
    }
    doLast {
        copy {
            from libraries()
            into "$buildDir/server/libraries"
        }
    }
}
