buildscript {
    repositories {
        mavenLocal()
        maven { url = 'http://files.minecraftforge.net/maven' }
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'eclipse'
apply plugin: 'net.minecraftforge.gradle.forgedev.patcher'

configurations {
    shade
    compile.extendsFrom shade
}

group = 'me.yourname'
version = '1.0.0'

ext {
    minecraft_version = '1.14.4'
    mcp_version = '20190829.143755'
    mappings_channel = 'snapshot'
    mappings_version = '20190719-1.14.3'
}

repositories {
    mavenCentral()

}

dependencies {
    shade 'net.minecraftforge:forgespi:1.1.+'
//    Use the shade to add the lib to the jar
//    or use compile if you want to load the lib from the version.json
//    from a maven repo
//    shade 'package-here'
//    compile 'package-here'
}

project(':mcp') {
    apply plugin: 'net.minecraftforge.gradle.forgedev.mcp'
    mcp {
        config = minecraft_version + '-' + mcp_version
        pipeline = 'joined'
    }
}

evaluationDependsOn(':mcp')

patcher {
    parent = project(':mcp')
    patchedSrc = file('src/main/java')
    mappings channel: mappings_channel, version: mappings_version
    mcVersion = '1.14.4'
}

jar {
    configurations.shade.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/**'
        }
    }
}

def fetchAssets = {
    def versionJson = new groovy.json.JsonSlurper().parse(project(':mcp').file('build/mcp/downloadJson/version.json'))
    def indexFile = file("run/assets/indexes/${versionJson.assetIndex.id}.json")
    indexFile.parentFile.mkdirs()
    indexFile.bytes = new URL(versionJson.assetIndex.url).bytes
    def hashes = new groovy.json.JsonSlurper().parse(indexFile).objects.values().collect { it.hash }.unique()
    hashes.parallelStream().forEach { hash ->
        def out = file("run/assets/objects/${hash.substring(0, 2)}/$hash")
        if (!out.exists()) {
            out.parentFile.mkdirs()
            out.bytes = new URL("https://resources.download.minecraft.net/${hash.substring(0, 2)}/$hash").bytes
        }
    }
}

task runclient(type: JavaExec) {
    group = "MCP"
    description = "Runs the client"
    doFirst {
        mkdir 'runclient'
    }
    classpath sourceSets.main.runtimeClasspath
    args '--gameDir', '.'
    args '--version', minecraft_version
    args '--assetsDir', 'assets'
    args '--assetIndex', '{asset_index}'
    args '--accessToken', '0'
    main 'net.minecraft.client.main.Main'
    workingDir 'runclient'
}

task setup() {
    group = "MCP"
    description = "Setups the dev workspace"
    dependsOn ':extractMapped'
    doLast {
        fetchAssets()
    }
}

task serverJar(type: Jar) {
    group = "MCP"
    description = "Builds a runnable server jar into build/server"
    archiveName = 'server.jar'
    destinationDir = file("$buildDir/server")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def clientExtra = { sourceSets.main.runtimeClasspath.find { it.name == 'client-extra.jar' } }
    def libraries = { sourceSets.main.runtimeClasspath.filter { it.isFile() && it.name.endsWith('.jar') && it.name != 'client-extra.jar' } }

    from sourceSets.main.output
    from({ zipTree(clientExtra()) }) {
        exclude 'META-INF/**'
    }

    doFirst {
        manifest.attributes(
                'Main-Class': 'net.minecraft.server.MinecraftServer',
                'Class-Path': libraries().collect { 'libraries/' + it.name }.join(' ')
        )
    }
    doLast {
        copy {
            from libraries()
            into "$buildDir/server/libraries"
        }
    }
}

task installClient(type: Jar) {
    group = "MCP"
    description = "Installs the client into the Minecraft launcher's versions folder"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def os = System.getProperty('os.name').toLowerCase()
    def home = System.getProperty('user.home')
    def mcDir = file(project.findProperty('mcDir') ?: (os.contains('win') ? System.getenv('APPDATA') + '/.minecraft'
            : os.contains('mac') ? home + '/Library/Application Support/minecraft' : home + '/.minecraft'))
    def versionName = project.findProperty('versionName') ?: minecraft_version + '-mcp'
    def versionDir = new File(mcDir, 'versions/' + versionName)

    archiveName = versionName + '.jar'
    destinationDir = versionDir

    from sourceSets.main.output
    from({ zipTree(sourceSets.main.runtimeClasspath.find { it.name == 'client-extra.jar' }) }) {
        exclude 'META-INF/**'
    }

    doLast {
        def json = new groovy.json.JsonSlurper().parse(project(':mcp').file('build/mcp/downloadJson/version.json'))
        json.remove('downloads')
        json.id = versionName
        new File(versionDir, versionName + '.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        println "Installed $versionName into $versionDir"
    }
}
